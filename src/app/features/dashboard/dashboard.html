<div class="mt-10 bg-white rounded-3xl border border-slate-100 shadow-xl shadow-slate-200/40 overflow-hidden">
  <div class="p-8 border-b border-slate-50 flex justify-between items-center">
    <h2 class="text-xl font-black text-slate-800">Danh sách công việc gần đây</h2>
    <button class="px-4 py-2 bg-slate-900 text-white text-xs font-bold rounded-xl hover:bg-slate-800 transition-all">
      + Thêm Task mới
    </button>
  </div>

  <div class="overflow-x-auto">
    <table class="w-full text-left border-collapse">
      <thead>
        <tr class="bg-slate-50/50">
          <th class="px-8 py-4 text-xs font-black text-slate-400 uppercase tracking-widest">Tên công việc</th>
          <th class="px-8 py-4 text-xs font-black text-slate-400 uppercase tracking-widest">Người làm</th>
          <th class="px-8 py-4 text-xs font-black text-slate-400 uppercase tracking-widest">Trạng thái</th>
          <th class="px-8 py-4 text-xs font-black text-slate-400 uppercase tracking-widest">Độ ưu tiên</th>
        </tr>
      </thead>
      <tbody>
        @for (item of tasks(); track item.id) {
          <tr class="border-b border-slate-50 hover:bg-slate-50/50 transition-colors group">
            <td class="px-8 py-5 text-sm font-bold text-slate-700">{{ item.title }}</td>
            <td class="px-8 py-5">
              <div class="flex items-center gap-2">
                <div class="w-6 h-6 rounded-full bg-indigo-100 text-[10px] flex items-center justify-center font-bold text-indigo-600">
                  {{ item.assignee.substring(0, 2).toUpperCase() }}
                </div>
                <span class="text-sm font-medium text-slate-600">{{ item.assignee }}</span>
              </div>
            </td>
            <td class="px-8 py-5">
              <span [class]="'px-3 py-1 rounded-full text-[10px] font-black uppercase ' + getStatusClass(item.status)">
                {{ item.status }}
              </span>
            </td>
            <td class="px-8 py-5 text-sm font-medium text-slate-400">{{ item.priority }}</td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
